apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ravi-devops-hpa
  namespace: ravi-devops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ravi-devops-app
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
