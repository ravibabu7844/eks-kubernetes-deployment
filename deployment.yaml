apiVersion: apps/v1
kind: Deployment
metadata:
  name: ravi-devops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ravi-devops-app
  template:
    metadata:
      labels:
        app: ravi-devops-app
    spec:
      containers:
        - name: ravi-devops-app
          image: YOUR_DOCKERHUB_USERNAME/ravi-devops-app:latest
          ports:
            - containerPort: 80
